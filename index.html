<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ice Cream? </title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="ice-cream">
            🍦 🍨 🍧
        </div>
        
        <p class="question">I have a very important question for you... 💕</p>

        <h1>🍦 Can I take you out for some ice cream? 🍦</h1>
        
    <div class="buttons">
    
        <button id="yesBtn">
            YES ❤️
        </button>

        <button id="noBtn">
            NO 😏
        </button>

    </div>

    <div id="dateSection" style="display: none;">

        <h2>🍦 YAY! You said YES! ❤️</h2>

        <p>Now let's choose a date for our ice-cream date! 🍨💕</p>

        <label for="datePicker">📅 Pick a date:</label>

        <input type="date" id="datePicker">

        <br><br>

        <button id="confirmDate">
            Confirm Date ❤️
        </button>

    </div>    
    </div>

    <script src="script.js"></script>
</body>
</html>
